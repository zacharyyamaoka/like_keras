# like_keras: the communication API (docs/CONTRACT.md).
#
# Ownership (CONTRACT §1): this file was started by lane RULER at M0 with only what kpi/ needs to RUN.
# - RULER owns: the `test` extra, [tool.pytest.ini_options], and nothing else here. Builders may ADD to this
#   file (the core lane turns the project into a package: [build-system], the `lk` script), but must keep the
#   ruler's sections as they are, because kpi/ runs through them.
# - CORE owns: [project] metadata, `dependencies` (the lean-core gate allows `robot-msgs` and nothing else),
#   the `dora` extra (CONTRACT §2.2), [build-system] and [project.scripts] once src/like_keras exists.

[project]
name = "like_keras"
version = "0.1.0"
description = "A communication API for robots: black-box components with ports, wired from outside, placed by a deployment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zach Yamaoka"}]
keywords = ["robotics", "dataflow", "dora-rs", "components", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# WHY one dependency: the lean-core gate (CONTRACT §2.1, kpi/deps.py) allows robot_msgs and nothing else.
# numpy (like_keras.codec, imported lazily) arrives through robot-msgs, which requires numpy>=1.26.
dependencies = ["robot-msgs>=0.3.0"]

[project.urls]
Homepage = "https://github.com/zacharyyamaoka/like_keras"
Repository = "https://github.com/zacharyyamaoka/like_keras"

[project.optional-dependencies]
# CONTRACT §2.2: backends/dora only. dora-rs-cli is the `dora` CLI the backend drives (backends/dora check_version
# refuses any other version), so the extra installs it too.
dora = ["dora-rs==0.5.0", "dora-rs-cli==0.5.0", "pyarrow"]
# RULER: kpi/ only. pyarrow is the independent Arrow oracle in kpi/golden; dora-rs and dora-rs-cli 0.5.0 are the
# raw-dora baselines of criterion 2 and the private coordinator/daemon the dora suites start; import-linter and ruff
# are criterion 3's and criteria 5 and 7's tools, locked here so the scoreboard never fetches them at run time.
test = ["pytest>=8", "pyperf>=2.6", "pyarrow", "dora-rs==0.5.0", "dora-rs-cli==0.5.0", "import-linter>=2.1", "ruff>=0.8"]

# CORE: like_keras is a package (src layout); `uv sync` installs it editable into /home/bam/like_keras/.venv.
# DORA: the `lk` CLI (CONTRACT §9.3), now that like_keras.cli exists (kpi/support/lk.py prefers it on PATH).
[project.scripts]
lk = "like_keras.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/like_keras"]

[tool.uv]
package = true

[tool.uv.sources]
# WHY a path source, as /home/bam/robot_controllers does: robot_msgs changes land on its main (the facility types
# and `adopt`, CONTRACT §2.3) before each release, and like_keras must see the same types the rig code uses.
robot-msgs = { path = "../robot_msgs", editable = true }

[tool.ruff]
# The width kpi/surface.py formats with before it counts SLOC (criterion 7).
line-length = 120
target-version = "py311"

# RULER: how kpi/ runs. `src` makes `import like_keras` resolve before the package is installed; `.` makes `kpi`
# an importable package, so components defined in kpi/ can be rebuilt in another process as module:qualname.
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["kpi"]
addopts = "-p no:cacheprovider"
markers = [
    "timing: asserts a latency or jitter limit; runs only when KPI_TIER=timing (rack unpowered or the fixed cloud VM)",
    "dora: needs the dora 0.5.0 CLI and a private coordinator/daemon (kpi/support/dora_private.py)",
    "native: needs a C++ .so built by cmake under build/",
]
