name: test
on: [push, pull_request, workflow_call]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # WHY: one job's failure cancelled the other, so 3.11's state went unseen (2026-11-23)
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY --no-sources: the robot-msgs path source (../robot_msgs) exists only on the dev box; CI uses PyPI.
      - run: uv sync --no-sources --python ${{ matrix.python }} --extra test --extra dora
      # The native suites load C++ boxes built by cmake under build/ (kpi/support/lk.py).
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev libbenchmark-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$PWD/.venv/bin/python && cmake --build build -j2
      # lk-dora-host runs every native process under dora (emit.native_host()); it links dora's cxx node API 0.5.0,
      # a cargo build of a few minutes, so that library is cached and only the host is relinked per run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/like_keras/dora-cxx-0.5.0
          key: dora-cxx-0.5.0-${{ runner.os }}-${{ hashFiles('cpp/hosts/build_dora_cxx.sh') }}
      - run: JOBS=4 CARGO_TARGET_DIR=$RUNNER_TEMP/dora-cxx-target cpp/hosts/build_dora_cxx.sh
      # WHY .venv/bin/python, not `uv run`: uv run re-syncs without --extra dora (and to .python-version's 3.12),
      # which removed the dora CLI mid-job: "dora --version did not answer (FileNotFoundError)".
      # WHY the memlock limit: lk-dora-host mlockall()s (CONTRACT §6.3) as on the rig; the runner's 8 MB default refuses
      # it (errno 12), and the host's warning line then lands in the logs tests compare exactly (test_final_drain).
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && PATH=$PWD/.venv/bin:$PATH .venv/bin/python -m pytest -q -rs tests
