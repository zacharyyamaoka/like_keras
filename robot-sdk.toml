# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "comms"
one_line = "Components, ports and systems in Python or C++, over dora; robot_msgs on the wire"
summary = "The communication API: components with ports, systems that wire them from outside, deployments in one process or across the network, over two backends (`inproc` threads and dora-rs 0.5). A component can also be C++, written against one header (`cpp/include/like_keras/lk.hpp`) and built with CMake's `lk_component()` into a `.so` that runs as a dora node or as a GIL-free real-time thread inside a Python process (`like_keras.native`). The frozen v0 contract is `docs/CONTRACT.md`."
use_when = "Connecting robot components, sensors and processes; dataflows; a C++ real-time controller that swaps in for a Python one in one line."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/like_keras"
pypi = "https://pypi.org/project/like_keras/"
docs = "https://github.com/zacharyyamaoka/like_keras/blob/main/docs/CONTRACT.md"

# Header, DiagnosticRecord, Metrics, LogRecord travel as records on the wire (codec, in-process backend); no public signature names them.

# The attached HardwareInterface backend (src/like_keras/hardware_interface.py, a6201f9): a pipe to an always-on core.
[[consumes]]
type = "robot_msgs.control.HardwareInterface"
symbols = ["like_keras.hardware_interface.serve_hardware_interface"]

[[consumes]]
type = "robot_msgs.control.JointTable"
symbols = ["like_keras.hardware_interface.AttachedBackend"]

[[consumes]]
type = "robot_msgs.control.ServoCommand"
symbols = ["like_keras.hardware_interface.AttachedBackend.write"]

[[produces]]
type = "robot_msgs.control.HardwareInterface"
symbols = ["like_keras.hardware_interface.attached_hardware_interface"]

[[produces]]
type = "robot_msgs.control.JointTable"
symbols = ["like_keras.hardware_interface.identity_table"]

[[produces]]
type = "robot_msgs.control.ServoState"
symbols = ["like_keras.hardware_interface.AttachedBackend.read"]
